<div class="min-h-screen flex">
    <!-- Panel izquierdo -->
    <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-blue-600 to-indigo-700 p-12 flex-col justify-between">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center">
                <svg width="24" height="24" fill="currentColor" class="text-white">
                    <rect x="3" y="3" width="7" height="7" rx="1.5" />
                    <rect x="3" y="14" width="7" height="7" rx="1.5" opacity="0.5" />
                    <rect x="14" y="3" width="7" height="7" rx="1.5" opacity="0.5" />
                    <rect x="14" y="14" width="7" height="7" rx="1.5" />
                </svg>
            </div>
            <span class="text-white font-bold text-3xl">Kaizen</span>
        </div>

        <div class="text-white">
            <h1 class="text-5xl font-bold mb-6">
                Construye tu mejor versión día a día
            </h1>
            <p class="text-blue-100 text-lg">
                Gestiona tus hábitos y tareas de forma sencilla y eficiente.
            </p>
        </div>

        <div class="text-blue-100 text-sm">
            © 2025 Kaizen
        </div>
    </div>

    <!-- Panel derecho -->
    <div class="flex-1 flex items-center justify-center bg-gray-50 p-8">
        <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl">
            <h2 class="text-3xl font-bold mb-2">Iniciar Sesión</h2>
            <p class="text-gray-600 mb-6">Bienvenido de nuevo</p>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
                <!-- Email -->
                <input type="email" formControlName="email" placeholder="Email"
                    class="w-full px-4 py-3 border rounded-lg" />

                <!-- Password -->
                <input type="password" formControlName="password" placeholder="Contraseña"
                    class="w-full px-4 py-3 border rounded-lg" />

                <!-- Error -->
                <div *ngIf="errorMessage" class="bg-red-50 text-red-700 p-3 rounded-lg text-sm">
                    {{ errorMessage }}
                </div>

                <button type="submit" [disabled]="loading || loginForm.invalid"
                    class="w-full bg-gray-900 text-white py-3 rounded-lg">
                    {{ loading ? 'Iniciando...' : 'Iniciar Sesión' }}
                </button>
            </form>

            <div class="my-6 text-center text-gray-500">O</div>

            <button (click)="signInWithGoogle()" class="w-full border py-3 rounded-lg">
                Continuar con Google
            </button>
        </div>
    </div>
</div>
