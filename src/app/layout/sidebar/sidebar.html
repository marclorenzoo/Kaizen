<aside class="flex flex-col h-full bg-white border-r border-gray-200 w-80 transition-all duration-300">
    <!-- Header con logo -->
    <div class="flex items-center gap-3 px-6 py-6 shrink-0 border-b border-gray-100">
        <div class="relative group">
            <div
                class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-lg blur opacity-20 group-hover:opacity-40 transition duration-200">
            </div>
            <div
                class="relative w-11 h-11 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center shadow-md">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                    class="text-white">
                    <rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor" />
                    <rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor" fill-opacity="0.5" />
                    <rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor" fill-opacity="0.5" />
                    <rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor" />
                </svg>
            </div>
        </div>
        <span class="font-bold text-2xl tracking-tight text-gray-900">Kaizen</span>
    </div>

    <!-- Menu label -->
    <div class="px-6 py-4 pt-6">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Menú</span>
    </div>

    <!-- Scrollable content -->
    <div class="flex-1 overflow-y-auto px-4 py-2 custom-scrollbar">
        <ul class="space-y-1">
            <!-- Dashboard -->
            <li>
                <a routerLink="/home/dashboard" routerLinkActive="bg-blue-50 text-blue-600"
                    class="group flex items-center gap-4 px-4 py-3.5 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-all duration-200 ease-in-out cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span class="text-base font-medium">Inicio</span>
                </a>
            </li>

            <!-- Tareas -->
            <li>
                <a routerLink="/home/tasks" routerLinkActive="bg-blue-50 text-blue-600"
                    class="group flex items-center gap-4 px-4 py-3.5 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-all duration-200 ease-in-out cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                    <span class="text-base font-medium">Tareas</span>
                </a>
            </li>

            <!-- Hábitos -->
            <li>
                <a routerLink="/home/habits" routerLinkActive="bg-blue-50 text-blue-600"
                    class="group flex items-center gap-4 px-4 py-3.5 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-all duration-200 ease-in-out cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span class="text-base font-medium">Hábitos</span>
                </a>
            </li>

            <!-- Estadísticas -->
            <li>
                <a routerLink="/home/stats" routerLinkActive="bg-blue-50 text-blue-600"
                    class="group flex items-center gap-4 px-4 py-3.5 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-all duration-200 ease-in-out cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    <span class="text-base font-medium">Estadísticas</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Footer placeholder -->
    <div class="p-4 border-t border-gray-100">
        <div class="flex items-center gap-3 rounded-xl p-3 hover:bg-gray-100 transition cursor-pointer">
            <!-- Avatar -->
            @if (currentUser$ | async; as user) {
            <div class="avatar">
                <div class="w-10 rounded-lg">
                    <img [src]="user.user_metadata['avatar_url'] || 'assets/images/default-pfp.jpg'"
                        alt="User avatar" />
                </div>
            </div>

            <!-- User info -->
            <div class="flex flex-col leading-tight">
                <span class="font-semibold text-sm text-gray-900">
                    {{ user.user_metadata['full_name'] }}
                </span>
                <span class="text-xs text-gray-500">
                    {{ user.email }}
                </span>
            </div>

            } @else {
            <p>No hay usuario logueado</p>
            }
        </div>
    </div>

</aside>
