<!-- Modal para editar hábito -->
<dialog id="edit_habit_modal" class="modal">
    <div class="modal-box max-w-md p-8 rounded-3xl">
        <!-- Header con título y botón cerrar -->
        <div class="flex justify-between items-center mb-6">
            <h3 class="font-bold text-xl text-gray-900">Editar Hábito</h3>
            <button (click)="closeModal()" class="btn btn-sm btn-circle btn-ghost text-gray-400 hover:text-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                        clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <!-- Formulario -->
        <form [formGroup]="habitForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Campos hidden para icon, color y frequency -->
            <input type="hidden" formControlName="icon" />
            <input type="hidden" formControlName="color" />
            <input type="hidden" formControlName="frequency" />

            <!-- Campo Nombre -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
                    Nombre
                </label>
                <input type="text" formControlName="name" placeholder="Ej: Meditación"
                    class="input input-bordered w-full bg-gray-50 border-gray-200 focus:bg-white focus:border-indigo-500 rounded-xl placeholder:text-gray-400"
                    [class.border-red-500]="habitForm.get('name')?.invalid && habitForm.get('name')?.touched" />
                @if (habitForm.get('name')?.invalid && habitForm.get('name')?.touched) {
                <p class="text-red-500 text-xs mt-1">El nombre es obligatorio</p>
                }
            </div>

            <!-- Selector de Icono -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">
                    Icono
                </label>
                <div class="flex flex-wrap gap-2" [class.max-h-[120px]]="!showAllIcons()"
                    [class.overflow-hidden]="!showAllIcons()">
                    @for (icon of visibleIcons; track icon.id) {
                    <button type="button" (click)="selectIcon(icon.id)"
                        [class]="selectedIcon() === icon.id 
                                ? 'w-12 h-12 rounded-xl bg-indigo-50 border-2 border-indigo-500 flex items-center justify-center text-indigo-600 hover:bg-indigo-100 transition-colors cursor-pointer' 
                                : 'w-12 h-12 rounded-xl bg-gray-50 border-2 border-gray-200 flex items-center justify-center text-gray-400 hover:bg-gray-100 hover:border-gray-300 transition-colors cursor-pointer'"
                        [title]="icon.name">
                        <span [innerHTML]="getSafeSvg(icon.svg)"></span>
                    </button>
                    }

                    <!-- Botón MÁS / MENOS -->
                    <button type="button" (click)="toggleShowAllIcons()"
                        class="w-12 h-12 rounded-xl bg-gray-50 border-2 border-gray-200 flex flex-col items-center justify-center text-gray-400 hover:bg-gray-100 hover:border-gray-300 transition-colors cursor-pointer">
                        @if (!showAllIcons()) {
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM12 10a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 100-4 2 2 0 000 4z" />
                        </svg>
                        <span class="text-[10px] font-medium mt-0.5">MÁS</span>
                        } @else {
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z"
                                clip-rule="evenodd" />
                        </svg>
                        <span class="text-[10px] font-medium mt-0.5">MENOS</span>
                        }
                    </button>
                </div>
            </div>

            <!-- Selector de Color -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">
                    Color
                </label>
                <div class="flex gap-3 items-center">
                    <!-- Colores predefinidos -->
                    @for (color of presetColors; track color.id) {
                    <button type="button" (click)="selectColor(color.value)"
                        class="w-10 h-10 rounded-full hover:scale-110 transition-all cursor-pointer"
                        [style.background-color]="color.value" [class.border-4]="true"
                        [style.border-color]="selectedColor() === color.value ? color.value + '66' : 'transparent'"></button>
                    }

                    <!-- Separador -->
                    <div class="w-px h-8 bg-gray-200 mx-1"></div>

                    <!-- Color Picker personalizado -->
                    <div class="relative">
                        <button type="button"
                            class="w-10 h-10 rounded-full border-2 overflow-hidden cursor-pointer hover:scale-110 transition-all flex items-center justify-center"
                            [style.background]="'conic-gradient(from 0deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00)'"
                            [class.border-gray-300]="isPresetColorSelected()"
                            [class.border-indigo-500]="!isPresetColorSelected()"
                            [class.ring-2]="!isPresetColorSelected()" [class.ring-indigo-200]="!isPresetColorSelected()"
                            (click)="colorPickerInput.click()">
                            @if (!isPresetColorSelected()) {
                            <div class="w-5 h-5 rounded-full border-2 border-white shadow-sm"
                                [style.background-color]="selectedColor()"></div>
                            }
                        </button>
                        <input #colorPickerInput type="color" class="absolute opacity-0 w-0 h-0" [value]="customColor()"
                            (input)="onColorPickerChange($event)" />
                    </div>
                </div>
            </div>

            <!-- Selector de Frecuencia -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">
                    Frecuencia
                </label>
                <div class="flex gap-3">
                    <!-- Diaria -->
                    <button type="button" (click)="selectFrequency('diaria')"
                        [class]="selectedFrequency() === 'diaria' 
                            ? 'flex-1 py-3 px-4 rounded-xl bg-indigo-50 border-2 border-indigo-500 text-indigo-600 font-semibold hover:bg-indigo-100 transition-colors cursor-pointer' 
                            : 'flex-1 py-3 px-4 rounded-xl bg-gray-50 border-2 border-gray-200 text-gray-600 font-semibold hover:bg-gray-100 hover:border-gray-300 transition-colors cursor-pointer'">
                        Diaria
                    </button>

                    <!-- Semanal -->
                    <button type="button" (click)="selectFrequency('semanal')"
                        [class]="selectedFrequency() === 'semanal' 
                            ? 'flex-1 py-3 px-4 rounded-xl bg-indigo-50 border-2 border-indigo-500 text-indigo-600 font-semibold hover:bg-indigo-100 transition-colors cursor-pointer' 
                            : 'flex-1 py-3 px-4 rounded-xl bg-gray-50 border-2 border-gray-200 text-gray-600 font-semibold hover:bg-gray-100 hover:border-gray-300 transition-colors cursor-pointer'">
                        Semanal
                    </button>

                    <!-- Mensual -->
                    <button type="button" (click)="selectFrequency('mensual')"
                        [class]="selectedFrequency() === 'mensual' 
                            ? 'flex-1 py-3 px-4 rounded-xl bg-indigo-50 border-2 border-indigo-500 text-indigo-600 font-semibold hover:bg-indigo-100 transition-colors cursor-pointer' 
                            : 'flex-1 py-3 px-4 rounded-xl bg-gray-50 border-2 border-gray-200 text-gray-600 font-semibold hover:bg-gray-100 hover:border-gray-300 transition-colors cursor-pointer'">
                        Mensual
                    </button>
                </div>
            </div>

            <!-- Botones de acción -->
            <div class="flex flex-col gap-3 mt-8">
                <div class="flex gap-3">
                    <button type="button" (click)="closeModal()"
                        class="flex-1 py-3 px-6 rounded-xl bg-gray-100 text-gray-700 font-semibold hover:bg-gray-200 transition-colors cursor-pointer">
                        Cancelar
                    </button>
                    <button type="submit"
                        class="flex-1 py-3 px-6 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                        [disabled]="habitForm.invalid">
                        Guardar Cambios
                    </button>
                </div>

                <!-- Botón de eliminar -->
                <button type="button" (click)="onDelete()"
                    class="w-full py-3 px-6 rounded-xl bg-red-50 text-red-600 font-semibold hover:bg-red-100 transition-colors cursor-pointer flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18" />
                        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                        <line x1="10" x2="10" y1="11" y2="17" />
                        <line x1="14" x2="14" y1="11" y2="17" />
                    </svg>
                    Eliminar Hábito
                </button>
            </div>
        </form>
    </div>

    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
