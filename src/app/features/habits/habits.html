<div class="habits-container h-full flex flex-col">

    <!-- Header Mobile -->
    <div class="px-4 pt-6 pb-4 md:hidden">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Mis Hábitos</h1>
                <p class="text-sm text-gray-500 mt-1">Mantén la constancia y visualiza tu progreso diario.</p>
            </div>

            <div class="flex items-center gap-3">
                <!-- Avatar -->
            </div>
        </div>
    </div>

    <!-- Section: Header (Top) Desktop -->
    <div class="header px-8 pt-8 pb-4 hidden md:block">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Mis Hábitos</h1>
                <p class="text-gray-500 text-sm mt-1">Mantén la constancia y visualiza tu progreso diario.</p>
            </div>

            <div class="flex items-center gap-3">
                <button class="btn btn-primary btn-sm gap-2" (click)="openCreateHabitModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                            clip-rule="evenodd" />
                    </svg>
                    Nuevo Hábito
                </button>
            </div>
        </div>
    </div>

    <div class="border-b border-gray-200 w-full mb-6 hidden md:block"></div>

    <!-- Modal de creación de hábitos -->
    <app-create-habit-modal></app-create-habit-modal>

    <!-- TODO: Aquí irá el contenido (Mapa de Constancia, Por hacer hoy, Completado hoy) -->

    <!-- FAB para móvil -->
    <button
        class="fixed bottom-20 right-4 w-14 h-14 bg-gray-800 hover:bg-gray-900 text-white rounded-2xl shadow-lg flex items-center justify-center z-50 md:hidden transition-all duration-200 active:scale-95"
        (click)="openCreateHabitModal()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
                d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                clip-rule="evenodd" />
        </svg>
    </button>

</div>
