<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl">

        <h2 class="text-3xl font-bold mb-4">
            Recuperar Contraseña
        </h2>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-5">

            <input type="email" formControlName="email" placeholder="tu@email.com"
                class="w-full px-4 py-3 border rounded-lg" />

            <div *ngIf="successMessage" class="bg-green-50 text-green-700 p-3 rounded">
                {{ successMessage }}
            </div>

            <div *ngIf="errorMessage" class="bg-red-50 text-red-700 p-3 rounded">
                {{ errorMessage }}
            </div>

            <button type="submit" [disabled]="loading || forgotForm.invalid"
                class="w-full bg-blue-600 text-white py-3 rounded-lg">
                {{ loading ? 'Enviando...' : 'Enviar instrucciones' }}
            </button>
        </form>

        <p class="text-center mt-6 text-sm">
            <a routerLink="/auth/login" class="text-blue-600 font-semibold">
                Volver al login
            </a>
        </p>
    </div>
</div>
