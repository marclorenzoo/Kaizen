<div class="tasks-container h-full flex flex-col">
    <!-- Section: Header (Top) -->
    <div class="header px-8 pt-8 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Gestión de Tareas</h1>
            <p class="text-gray-500 text-sm mt-1">Organiza tu flujo de trabajo y prioridades.</p>
        </div>

        <button class="btn btn-primary btn-sm gap-2" onclick="create_task_modal.showModal()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                    clip-rule="evenodd" />
            </svg>
            Crear Tarea
        </button>
    </div>

    <!-- Note: The user mentioned Search/Filters filters are not urgent, so I will placeholders or keep it simple as requested, 
       but for now I am focusing on the columns below as requested. -->

    <div class="border-b border-gray-200 w-full mb-6"></div>

    <!-- Incluir el componente del modal -->
    <app-create-task-modal (taskCreated)="loadTasks()"></app-create-task-modal>

    <!-- Section: Columns (Bottom) - The detailed part -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1 px-8 pb-6 overflow-hidden">
        <app-task-column class="h-full block min-h-0" title="Atrasadas" [tasks]="tasks().atrasadas"
            classification="atrasadas" color="#EF4444" badgeClass="bg-red-100 text-red-700" (taskUpdated)="loadTasks()">
        </app-task-column>

        <app-task-column class="h-full block min-h-0" title="Hoy" [tasks]="tasks().hoy" classification="hoy"
            color="#6366F1" badgeClass="bg-indigo-100 text-indigo-700" (taskUpdated)="loadTasks()">
        </app-task-column>

        <app-task-column class="h-full block min-h-0" title="Próximas" [tasks]="tasks().proximas"
            classification="proximas" color="#3B82F6" badgeClass="bg-blue-100 text-blue-700"
            (taskUpdated)="loadTasks()">
        </app-task-column>
    </div>

    <!-- Toast Notification -->
    <!-- Toast Notification -->
    @if (toastService.isVisible()) {
    <div class="toast toast-end z-50 mb-4 mr-4">
        <div
            class="flex items-center bg-white rounded-2xl shadow-xl p-4 min-w-[380px] border border-gray-100 animate-slide-up">

            <!-- Icono cículo verde -->
            <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center flex-shrink-0">
                <div class="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-white stroke-current stroke-[3]"
                        viewBox="0 0 24 24" fill="none">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
            </div>

            <!-- Textos -->
            <div class="ml-4 flex-1">
                <h3 class="font-bold text-gray-900 text-base leading-tight">{{ toastService.title() }}</h3>
                <p class="text-gray-500 text-sm mt-0.5 font-medium">{{ toastService.message() }}</p>
            </div>

            <!-- Divisor Vertical -->
            <div class="w-px h-8 bg-gray-200 mx-4"></div>

            <!-- Botón Acción -->
            @if (toastService.action()) {
            <button
                class="text-indigo-600 font-bold text-sm hover:text-indigo-800 transition-colors pr-2 cursor-pointer"
                (click)="toastService.action()?.onClick()">
                {{ toastService.action()?.label }}
            </button>
            }
        </div>
    </div>
    }
</div>
