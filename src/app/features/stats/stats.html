<div class="stats-container h-full flex flex-col">

    <!-- Header Mobile -->
    <div class="px-4 pt-6 pb-4 md:hidden">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Estadísticas</h1>
                <p class="text-sm text-gray-500 mt-1">Analiza tu productividad y rendimiento.</p>
            </div>
        </div>
    </div>

    <!-- Header Desktop -->
    <div class="header px-8 pt-8 pb-4 hidden md:block">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Estadísticas</h1>
                <p class="text-gray-500 text-sm mt-1">Analiza tu productividad y rendimiento.</p>
            </div>
        </div>
    </div>

    <div class="border-b border-gray-200 w-full mb-6 hidden md:block"></div>

    <!-- Loading State -->
    @if (isLoading()) {
    <div class="flex-1 flex items-center justify-center">
        <div class="text-center">
            <div class="loading loading-spinner loading-lg text-gray-400"></div>
            <p class="text-gray-400 text-sm mt-3">Cargando estadísticas...</p>
        </div>
    </div>
    } @else {
    <div class="px-4 md:px-8 pt-2 pb-8 space-y-8 overflow-y-auto flex-1">

        <!-- Sección 1: KPI Summary Cards -->
        <app-summary-cards [summary]="summary()"></app-summary-cards>

        <!-- Sección 2: Gráfico Semanal + Ranking de Hábitos -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <app-weekly-chart [data]="weeklyActivity()"></app-weekly-chart>
            <app-habits-ranking [rankings]="habitsRanking()"></app-habits-ranking>
        </div>

        <!-- Sección 3: Mapa de Actividad -->
        <app-activity-heatmap [data]="heatmapData()" [year]="currentYear"></app-activity-heatmap>

    </div>
    }

</div>
